org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Duser.language.format=en -Duser.country.format=US
android.useAndroidX=true
