name = "smartdocs-ai"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
PROVIDER_URL = "https://api.groq.com/openai/v1"
DEFAULT_MODEL = "llama-3.3-70b-versatile"
# Speech (AI voices, audio summary, podcast). Any OpenAI-compatible /audio/speech works.
# With OpenAI: TTS_URL = "https://api.openai.com/v1", TTS_MODEL = "gpt-4o-mini-tts", and `wrangler secret put TTS_KEY`.
TTS_URL = "https://api.openai.com/v1"
TTS_MODEL = "gpt-4o-mini-tts"
TTS_VOICES = "alloy,ash,coral,echo,fable,nova,onyx,sage,shimmer"
TTS_FORMAT = "mp3"
TTS_MAX_CHARS = "1500"
# Groq instead (Saudi Arabic voices, WAV only, 200 chars per request):
# TTS_URL = "https://api.groq.com/openai/v1"
# TTS_MODEL = "canopylabs/orpheus-arabic-saudi"
# TTS_VOICES = "noura,abdullah,fahad,sultan,lulwa,aisha"
# TTS_FORMAT = "wav"
# TTS_MAX_CHARS = "190"

# Vision (images in chat). Groq: a Llama 4 vision model. Remove to disable.
VISION_MODEL = "meta-llama/llama-4-scout-17b-16e-instruct"
# Speech to text (audio file transcription). Groq Whisper uses PROVIDER_KEY unless `wrangler secret put STT_KEY`.
STT_URL = "https://api.groq.com/openai/v1"
STT_MODEL = "whisper-large-v3-turbo"
# Image generation: needs `wrangler secret put IMAGE_KEY` (an OpenAI key)
IMAGE_URL = "https://api.openai.com/v1"
IMAGE_MODEL = "gpt-image-1"
# Embeddings for re-ranking document passages: needs `wrangler secret put EMBED_KEY`
EMBED_URL = "https://api.openai.com/v1"
EMBED_MODEL = "text-embedding-3-small"
# Live web search in chat: `wrangler secret put SEARCH_KEY` (Brave Search API key)

# optional per-device daily limit: create a KV namespace and paste its id
# [[kv_namespaces]]
# binding = "RATE"
# id = "<your-kv-id>"
