name: Promo video

# Records the real app on a phone emulator (app/src/androidTest/.../promo) and renders the promo video from that
# footage (marketing/promo). Runs for marketing/** branches and by hand; it is not part of the app's build.
on:
  push:
    branches: [ 'marketing/**' ]
  workflow_dispatch:

concurrency:
  group: promo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PnoAbiSplits --no-daemon --stacktrace
      # a phone in portrait, with animations on: the footage should look like the app in someone's hand
      - name: Record the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :app:connectedDebugAndroidTest -PnoAbiSplits --no-daemon -Pandroid.testInstrumentationRunnerArguments.package=com.smartdocs.editor.promo; echo "capture tests exit code: $?"
            timeout 300 adb pull /sdcard/Movies/promo footage || echo "nothing pulled"
            ls -la footage || true
      - uses: actions/upload-artifact@v4
        with:
          name: promo-footage
          path: footage/
          if-no-files-found: error

  render:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: marketing/promo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: promo-footage
          path: marketing/promo/public/footage
      - name: Install
        run: npm install --no-audit --no-fund
      - name: List the footage for the video
        run: node scripts/manifest.mjs
      - name: Browser for rendering
        run: npx remotion browser ensure
      - name: Render the video
        run: npx remotion render src/index.ts Promo out/smartdocs-promo.mp4 --concurrency=2 --log=info
      # stills at the middle of every scene, for a quick look without playing the video
      - name: Render stills
        if: always()
        run: |
          for f in 45 150 300 480 660 840 1020 1200 1380 1560 1740; do npx remotion still src/index.ts Promo "out/still-$f.png" --frame=$f --scale=0.5 || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promo-video
          path: |
            marketing/promo/out/
            marketing/promo/src/footage.json
          if-no-files-found: ignore
