name: Build APK

# Every branch gets its own build + APK (named after the branch), so each session can push its
# work-in-progress branch and test it. Only main is the integration branch (merged by one session).
on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The runner image already ships the Android SDK ($ANDROID_HOME); android-actions/setup-android fails on current runners.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon 2>&1 | tee test.log
      # Job logs need admin rights to download; compiler errors and failed tests are re-emitted as annotations,
      # which anyone can read (check-runs/<job>/annotations). Groups of 8 lines per annotation (max 10 per step).
      - name: Error annotations
        if: failure()
        run: |
          { grep -E '^e: |error:' build.log 2>/dev/null; grep -E -A3 ' FAILED$' test.log 2>/dev/null; } | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -80 > errs.txt || true
          split -l 8 errs.txt part_ || true
          for f in part_*; do [ -f "$f" ] && echo "::error::$(awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}' "$f")"; done
      - name: Artifact name
        id: name
        run: echo "n=SmartDocs-$(echo '${{ github.head_ref || github.ref_name }}' | tr '/ ' '--')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.n }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Heavy-file ("torture") tests on an emulator: a 1,000-page PDF, a 500 MB scan, a 50-megapixel photo, Word files full
  # of photos, a 100,000-row workbook and a 25 MB CSV are opened, scrolled and zoomed; a crash or a full heap fails the
  # test (app/src/androidTest/.../torture). A separate job, so the APK above is published even when one of these fails.
  torture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # built before the emulator starts, so a compile error fails here and the two never compete for memory
      - name: Build app and test APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PnoAbiSplits --no-daemon --stacktrace 2>&1 | tee torture-build.log
      # tablet screen, Android 13 and a 512 MB app heap: the owner's Samsung Tab S7+ class of device
      - name: Torture tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_c
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -G 16M
            adb logcat -c
            ./gradlew :app:connectedDebugAndroidTest -PnoAbiSplits --no-daemon; code=$?; adb logcat -d -s TortureReport:I ParseGate:I > torture-report.txt; adb logcat -d -b crash > torture-crashes.txt; exit $code
      - name: Report
        if: always()
        run: |
          {
            echo '### Torture report'
            echo '```'
            sed -E 's/^.*TortureReport: //' torture-report.txt 2>/dev/null | grep -v 'ParseGate' || echo '(no report lines: the tests did not run)'
            echo '```'
            if [ -s torture-crashes.txt ]; then echo '### Crashes'; echo '```'; head -c 20000 torture-crashes.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          { grep -E '^e: |error:' torture-build.log 2>/dev/null; grep -E 'FATAL EXCEPTION|OutOfMemoryError' -A6 torture-crashes.txt 2>/dev/null; } | head -40 > errs.txt || true
          split -l 8 errs.txt part_ || true
          for f in part_*; do [ -f "$f" ] && echo "::error::$(awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}' "$f")"; done; true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torture-report-${{ github.run_number }}
          path: |
            torture-report.txt
            torture-crashes.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  # No password, key or token may enter the repository (it is public). .gitleaks.toml lists the known false alarms.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the whole history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

  # The "fast" APK: the release code (R8-optimized, not debuggable) signed with the debug key, so it installs on any
  # device next to the test build. Judge the app's speed with this one; the debug APK above is always slower.
  # It also proves on every push that the release configuration still builds.
  fast-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build fast APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assemblePerf --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Error annotations
        if: failure()
        run: |
          grep -E '^e: |error:|ERROR:|^> |Missing class|What went wrong' -A2 build.log 2>/dev/null | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -80 > errs.txt || true
          split -l 8 errs.txt part_ || true
          for f in part_*; do [ -f "$f" ] && echo "::error::$(awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}' "$f")"; done; true
      - name: Artifact name
        id: name
        run: echo "n=$(echo '${{ github.head_ref || github.ref_name }}' | tr '/ ' '--')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: FastAPK-${{ steps.name.outputs.n }}
          path: app/build/outputs/apk/perf/*.apk
          if-no-files-found: error
      # needed to read a crash trace of the fast build (its class and method names are shortened)
      - uses: actions/upload-artifact@v4
        with:
          name: FastAPK-mapping-${{ steps.name.outputs.n }}
          path: app/build/outputs/mapping/perf/mapping.txt
          if-no-files-found: ignore

  # Speed report: both builds are installed on the tablet emulator and cold-started six times; the report has the
  # median start time and the app's own breakdown of where the start goes (tag StartupTrace). A fast build that does
  # not stay running after launch fails this job.
  speed:
    needs: [build, fast-apk]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure cold starts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_c
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash .github/scripts/measure-startup.sh "$(ls apks/FastAPK-*/*universal*.apk 2>/dev/null | head -1)" com.smartdocs.editor.perf "Fast build (R8-optimized: what users get)"; echo $? > fast.code
            bash .github/scripts/measure-startup.sh "$(ls apks/SmartDocs-*/*universal*.apk 2>/dev/null | head -1)" com.smartdocs.editor.test "Debug build (the test APK)"; echo $? > debug.code
            exit $(( $(cat fast.code) + $(cat debug.code) ))
      - name: Report
        if: always()
        run: |
          { echo '### Speed report (tablet emulator; compare the two builds, not the absolute numbers)'; echo '```'; cat speed-report.txt 2>/dev/null || echo '(nothing was measured)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-report-${{ github.run_number }}
          path: speed-report.txt
          if-no-files-found: ignore
