name: Build APK

# Every branch gets its own build + APK (named after the branch), so each session can push its
# work-in-progress branch and test it. Only main is the integration branch (merged by one session).
on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The runner image already ships the Android SDK ($ANDROID_HOME); android-actions/setup-android fails on current runners.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Artifact name
        id: name
        run: echo "n=SmartDocs-$(echo '${{ github.head_ref || github.ref_name }}' | tr '/ ' '--')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.n }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
