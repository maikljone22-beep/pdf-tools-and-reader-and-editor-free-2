name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The runner image already ships the Android SDK ($ANDROID_HOME); android-actions/setup-android fails on current runners.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SmartDocs-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
